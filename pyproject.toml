[project]
name = "csv2sql"
version = "1.0.0"
description = "Load messy CSVs into a typed, keyed Postgres schema and ask questions about it in plain English."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langchain>=1.4",
  "langchain-openai>=1.7",
  "langchain-anthropic>=1.7",
  "langgraph>=1.2",
  "psycopg[binary]>=3.3",
  "psycopg-pool>=3.3",
  "pydantic>=2.11",
  "pydantic-settings>=2.16",
  "python-multipart>=0.0.20",
  "sqlglot>=30",
  "starlette>=0.47",
  "uvicorn>=0.35",
]

[project.scripts]
csv2sql-ingest = "csv2sql.ingest.__main__:main"
csv2sql-eval = "csv2sql.evals:main"

[dependency-groups]
server = ["langgraph-cli[inmem]>=0.4"]
dev = [
  { include-group = "server" },
  "pyright>=1.1.414",
  "pytest>=9",
  "httpx>=0.28",
  "pytest-asyncio>=1.2",
  "ruff>=0.17",
  "testcontainers[postgres]>=4.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore:testcontainers.postgres is deprecated:DeprecationWarning"]
